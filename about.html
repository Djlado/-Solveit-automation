    :root { color-scheme: dark; }

              <option value="Slack / Teams Notification Bot">Slack / Teams Notification Bot</option>

              <option value="General Inquiry">General Inquiry</option>
            </select>
          </div>
          <div>
            <label for="problemDescription" class="mb-2 block text-sm font-semibold text-slate-200">The Bottleneck</label>
            <textarea id="problemDescription" name="bottleneck" rows="5" placeholder="What is your biggest operational bottleneck right now?" required class="w-full resize-y border border-white/15 bg-[#08111f] px-4 py-3 text-white outline-none transition placeholder:text-slate-500 focus:border-sky-300"></textarea>
          </div>
          <input type="hidden" id="budget" name="budget" value="">
          <input type="hidden" id="additionalNotes" name="additionalNotes" value="">
          <button type="submit" class="inline-flex w-full items-center justify-center gap-3 rounded-sm bg-sky-400 px-6 py-3.5 text-sm font-bold text-slate-950 transition hover:bg-sky-300">Submit Inquiry <span aria-hidden="true">&#8594;</span></button>
